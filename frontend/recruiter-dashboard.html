<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Recruiter Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>JobTrack</h1>
            <p>Recruiter Dashboard</p>
        </div>

        <button id="logoutButton">Logout</button>
    </header>

    <main class="dashboard-container">

        <h2>Recruiter Dashboard</h2>

        <div class="welcome-card">
            <h3>Welcome, Recruiter 👋</h3>
            <p>Manage your job postings and applications from one place.</p>
        </div>

        <div class="dashboard-cards">

            <div class="dashboard-card">
                <h3>Post a Job</h3>
                <p>Create and publish a new job opportunity.</p>
                <button id="postJobButton">Post Job</button>
            </div>

            <div class="dashboard-card">
                <h3>Manage Jobs</h3>
                <p>View and manage your posted job openings.</p>
                <button id="manageJobsButton">Manage Jobs</button>
            </div>

            <div class="dashboard-card">
                <h3>Applicants</h3>
                <p>Review candidates who applied to your jobs.</p>
                <button id="applicantsButton">View Applicants</button>
            </div>

        </div>

    </main>

    <script src="recruiter-dashboard-v2.js"></script>

</body>

</html>
