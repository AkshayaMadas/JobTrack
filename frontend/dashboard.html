<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>JobTrack</h1>
            <p>Job Application Tracking System</p>
        </div>

        <button id="logoutButton">Logout</button>
    </header>

    <main class="dashboard-container">

        <h2>Dashboard</h2>

        <div class="welcome-card">
            <h3>Welcome to JobTrack 👋</h3>
            <p>Manage your job applications and track your career journey.</p>
        </div>

        <div class="dashboard-cards">

            <div class="dashboard-card">
                <h3>Browse Jobs</h3>
                <p>Explore available job opportunities.</p>
                <button id="viewJobsButton">View Jobs</button>
            </div>

            <div class="dashboard-card">
                <h3>My Applications</h3>
                <p>Track the jobs you have applied for.</p>
               <button id="viewApplicationsButton">View Applications</button>
            </div>

            <div class="dashboard-card">
                <h3>Profile</h3>
                <p>View and manage your profile.</p>
                <button id="viewProfileButton">View Profile</button>
            </div>

        </div>

    </main>

    <script src="dashboard.js"></script>

</body>

</html>
